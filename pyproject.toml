[project]
name = "academic-video"
version = "0.1.0"
description = "Evidence-grounded agentic workflow for turning academic papers into research videos"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
parser = ["docling>=2.0"]
voice = ["whisperx>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
